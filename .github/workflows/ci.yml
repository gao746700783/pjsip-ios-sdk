name: iOS Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -scheme PJSIPiOS

      - name: Build PJSIPiOS for iOS Simulator (arm64)
        run: |
          xcodebuild build \
            -scheme PJSIPiOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -scheme PJSIPiOS \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
